[project]
name = "control-room"
version = "0.1.0"
description = "CONTROL ROOM — LLM-powered mind map dialogue with OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.19",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "watchfiles>=0.24",
]

[project.scripts]
control-room = "watcher:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
